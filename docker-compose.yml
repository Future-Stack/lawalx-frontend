services:
  digitalscreen-frontend:
    image: softvence/digitalscreen-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-https://api.tapedigitaldisplay.com/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-https://api.tapedigitaldisplay.com}
        BACKEND_URL: ${BACKEND_URL:-https://api.tapedigitaldisplay.com}
    container_name: digitalscreen_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://api.tapedigitaldisplay.com/api/v1}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-https://api.tapedigitaldisplay.com}
      - BACKEND_URL=${BACKEND_URL:-https://api.tapedigitaldisplay.com}
